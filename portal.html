<!DOCTYPE html>
<html class="dark scroll-smooth" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Secure Investor Portal | TERRAQUEST</title>
    
    <link rel="icon" type="image/jpeg" href="Terraquest Investment Logo Icon on black-01.jpg"/>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif:wght@400;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
      import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-auth.js";

      // Your exact Firebase configuration
      const firebaseConfig = {
        apiKey: "AIzaSyDhErC-HBkPWh60enf5XfkB2AFjTKlEnu4",
        authDomain: "terraquest-fb9ce.firebaseapp.com",
        projectId: "terraquest-fb9ce",
        storageBucket: "terraquest-fb9ce.firebasestorage.app",
        messagingSenderId: "794154054419",
        appId: "1:794154054419:web:1fbbb4f201d0d7221520e6",
        measurementId: "G-BWGNBQP2ZM"
      };

      // Initialize Firebase
      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);

      // Make auth globally available for our buttons
      window.auth = auth;
      window.signInWithEmailAndPassword = signInWithEmailAndPassword;
      window.createUserWithEmailAndPassword = createUserWithEmailAndPassword;
    </script>

    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary": "#f2ca50",
              "background": "#121414",
              "surface-container": "#1f2020",
            },
            fontFamily: {
              "headline": ["Noto Serif"],
              "body": ["Inter"]
            }
          },
        },
      }
    </script>
    <style>
        .glass-nav { background: rgba(18, 20, 20, 0.95); backdrop-filter: blur(20px); }
        .hidden-form { display: none; }
    </style>
</head>
<body class="bg-background text-[#e3e2e2] font-body flex flex-col min-h-screen">

<nav class="fixed top-0 w-full z-50 glass-nav flex justify-between items-center px-4 sm:px-6 md:px-12 py-4 md:py-5 border-b border-white/5">
    <div class="text-xl md:text-2xl font-bold text-[#D4AF37] tracking-[0.1em] font-headline cursor-pointer hover:opacity-80 transition-opacity" onclick="location.href='index.html'">
        TERRAQUEST FZCO
    </div>
    <div class="flex items-center gap-3 ml-auto text-xs text-white/50 tracking-widest uppercase">
        Secure Portal
    </div>
</nav>

<main class="flex-grow flex items-center justify-center pt-32 pb-20 px-5 sm:px-6">
    <div class="w-full max-w-md bg-surface-container border border-white/10 rounded shadow-2xl p-8 relative overflow-hidden">
        <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-primary to-[#d4af37]"></div>
        
        <div class="flex justify-center border-b border-white/10 mb-8">
            <button onclick="toggleForm('login')" id="tab-login" class="px-6 py-3 text-xs tracking-widest uppercase font-bold text-primary border-b-2 border-primary transition-all">Log In</button>
            <button onclick="toggleForm('register')" id="tab-register" class="px-6 py-3 text-xs tracking-widest uppercase font-bold text-white/40 hover:text-white transition-all">Request Access</button>
        </div>

        <div id="error-msg" class="hidden-form bg-red-900/30 border border-red-500/50 text-red-200 text-xs p-3 rounded mb-4 text-center"></div>

        <div id="form-login">
            <h2 class="text-2xl font-headline text-white mb-6 text-center">Existing Investors</h2>
            <div class="space-y-4">
                <div>
                    <label class="block text-[10px] text-white/50 uppercase tracking-widest mb-1">Institutional Email</label>
                    <input type="email" id="login-email" class="w-full bg-[#121414] border border-white/10 rounded px-4 py-3 text-white focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all" placeholder="name@institution.com">
                </div>
                <div>
                    <label class="block text-[10px] text-white/50 uppercase tracking-widest mb-1">Password</label>
                    <input type="password" id="login-password" class="w-full bg-[#121414] border border-white/10 rounded px-4 py-3 text-white focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all" placeholder="••••••••">
                </div>
                <button onclick="handleLogin()" class="w-full bg-primary text-[#121414] px-4 py-3 text-xs tracking-widest uppercase font-bold rounded hover:bg-white transition-all mt-4">
                    Enter Portal
                </button>
            </div>
        </div>

        <div id="form-register" class="hidden-form">
            <h2 class="text-2xl font-headline text-white mb-6 text-center">Request Access</h2>
            <div class="space-y-4">
                <div>
                    <label class="block text-[10px] text-white/50 uppercase tracking-widest mb-1">Institution Name</label>
                    <input type="text" id="reg-company" class="w-full bg-[#121414] border border-white/10 rounded px-4 py-3 text-white focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all" placeholder="e.g. Goldman Sachs">
                </div>
                <div>
                    <label class="block text-[10px] text-white/50 uppercase tracking-widest mb-1">Institutional Email</label>
                    <input type="email" id="reg-email" class="w-full bg-[#121414] border border-white/10 rounded px-4 py-3 text-white focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all" placeholder="name@institution.com">
                </div>
                <div>
                    <label class="block text-[10px] text-white/50 uppercase tracking-widest mb-1">Create Password</label>
                    <input type="password" id="reg-password" class="w-full bg-[#121414] border border-white/10 rounded px-4 py-3 text-white focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all" placeholder="Min 6 characters">
                </div>
                <button onclick="handleRegister()" class="w-full border border-primary text-primary px-4 py-3 text-xs tracking-widest uppercase font-bold rounded hover:bg-primary hover:text-[#121414] transition-all mt-4">
                    Submit Credentials
                </button>
            </div>
        </div>

    </div>
</main>

<script>
    function toggleForm(type) {
        document.getElementById('error-msg').style.display = 'none';
        if(type === 'login') {
            document.getElementById('form-login').style.display = 'block';
            document.getElementById('form-register').style.display = 'none';
            document.getElementById('tab-login').classList.add('text-primary', 'border-b-2', 'border-primary');
            document.getElementById('tab-login').classList.remove('text-white/40');
            document.getElementById('tab-register').classList.remove('text-primary', 'border-b-2', 'border-primary');
            document.getElementById('tab-register').classList.add('text-white/40');
        } else {
            document.getElementById('form-login').style.display = 'none';
            document.getElementById('form-register').style.display = 'block';
            document.getElementById('tab-register').classList.add('text-primary', 'border-b-2', 'border-primary');
            document.getElementById('tab-register').classList.remove('text-white/40');
            document.getElementById('tab-login').classList.remove('text-primary', 'border-b-2', 'border-primary');
            document.getElementById('tab-login').classList.add('text-white/40');
        }
    }

    function showError(msg) {
        const errorBox = document.getElementById('error-msg');
        errorBox.textContent = msg;
        errorBox.style.display = 'block';
    }

    function handleLogin() {
        const email = document.getElementById('login-email').value;
        const pass = document.getElementById('login-password').value;
        
        if(!email || !pass) return showError("Please enter email and password.");

        window.signInWithEmailAndPassword(window.auth, email, pass)
            .then((userCredential) => {
                window.location.href = 'dashboard.html';
            })
            .catch((error) => {
                showError("Invalid credentials. Please verify your email and password.");
            });
    }

    function handleRegister() {
        const email = document.getElementById('reg-email').value;
        const pass = document.getElementById('reg-password').value;
        const company = document.getElementById('reg-company').value;

        if(!email || !pass || !company) return showError("Please fill out all fields.");

        window.createUserWithEmailAndPassword(window.auth, email, pass)
            .then((userCredential) => {
                // Eventually we will route this to pending.html, but for testing, let's send them to dashboard
                window.location.href = 'dashboard.html';
            })
            .catch((error) => {
                showError(error.message);
            });
    }
</script>

</body>
</html>
